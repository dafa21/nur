name: Deploy to VPS (nurhealthconnection.com)

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Build & Deploy App to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ─── STEP 1: KILL ROGUE PROCESSES VIA PLAIN SSH ───────────────────────
      # Menggunakan plain SSH untuk menghindari isu timeout dari docker action.
      # Kita matikan PM2 dan node secara paksa agar CPU 100% turun sebelum SCP.
      - name: Force Kill Node & PM2 on VPS
        env:
          SSH_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          sudo apt-get install -y sshpass
          export SSHPASS=$SSH_PASSWORD
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=60 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "echo '=== Restarting nurhealth-main ===' && \
             pm2 stop nurhealth-main || true && \
             echo 'Ready for deployment.'" || echo "Gagal terhubung, tapi kita akan tetap lanjut."

      # ─── STEP 2: Setup Node.js di GitHub Runner (RAM 7GB, CPU cepat) ───────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ─── STEP 3: Install deps & Build DI GITHUB RUNNER (bukan di VPS!) ─────
      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          NODE_ENV: production

      # Verifikasi output build ada
      - name: Verify build output
        run: |
          echo "=== Isi folder dist ==="
          ls -la dist/
          if [ ! -f "dist/server.cjs" ]; then
            echo "ERROR: dist/server.cjs tidak ditemukan!"
            exit 1
          fi
          echo "✅ dist/server.cjs siap: $(du -sh dist/server.cjs)"

      # ─── STEP 4: Copy hasil build ke VPS via SCP ───────────────────────────
      - name: Copy dist folder to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: "dist/"
          target: "/var/www/nurhealth"
          timeout: 120s

      - name: Copy config files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: "ecosystem.config.cjs,package.json,package-lock.json"
          target: "/var/www/nurhealth"
          timeout: 60s

      # ─── STEP 5: Jalankan perintah di VPS ─────────────────────────────────
      - name: Restart app on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          command_timeout: 10m
          script: |
            echo "=== [1/4] Masuk ke direktori deploy..."
            cd /var/www/nurhealth
            echo "  → PWD: $(pwd)"
            
            echo "=== [2/4] Install runtime dependencies..."
            npm install --production 2>&1 | tail -5
            echo "  → npm install selesai"

            echo "=== [3/4] Memulai aplikasi dengan PM2..."
            export NODE_ENV=production
            pm2 start ecosystem.config.cjs
            sleep 3

            echo "=== [4/4] Status akhir PM2..."
            pm2 list
            pm2 save 2>/dev/null || true

            echo ""
            echo "✅ === DEPLOYMENT SELESAI ==="
