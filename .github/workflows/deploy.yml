name: Deploy to VPS (nurhealthconnection.com)

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Build & Deploy App to VPS
    runs-on: ubuntu-latest

    steps:
      # ─── STEP 1: Checkout kode ─────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ─── STEP 1.5: KILL ROGUE PROCESSES DI VPS DULU ─────────────────────────
      # VPS CPU 99% membuat koneksi SCP/SSH sering timeout (i/o timeout).
      # Kita kill dulu di awal agar VPS bernapas sebelum kita kirim file.
      - name: Free up VPS CPU
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          timeout: 60s
          script: |
            echo "Membunuh proses tsx yang membuat CPU 100%..."
            pkill -f "tsx server.ts" 2>/dev/null || true
            pkill -f "npx.*tsx" 2>/dev/null || true
            sleep 2
            echo "CPU seharusnya sudah lega."

      # ─── STEP 2: Setup Node.js di GitHub Runner (RAM 7GB, CPU cepat) ───────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ─── STEP 3: Install deps & Build DI GITHUB RUNNER (bukan di VPS!) ─────
      # VPS tidak perlu build — GitHub Actions punya RAM 7GB vs VPS 1-2GB
      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          NODE_ENV: production

      # Verifikasi output build ada
      - name: Verify build output
        run: |
          echo "=== Isi folder dist ==="
          ls -la dist/
          if [ ! -f "dist/server.cjs" ]; then
            echo "ERROR: dist/server.cjs tidak ditemukan!"
            exit 1
          fi
          echo "✅ dist/server.cjs siap: $(du -sh dist/server.cjs)"

      # ─── STEP 4: Copy hasil build ke VPS via SCP ───────────────────────────
      - name: Copy dist folder to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: "dist/"
          target: "/var/www/nurhealth"

      - name: Copy config files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: "ecosystem.config.cjs,package.json,package-lock.json"
          target: "/var/www/nurhealth"

      # ─── STEP 5: Jalankan perintah di VPS ─────────────────────────────────
      # VPS hanya: npm install + pm2 restart (tidak perlu build!)
      - name: Restart app on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          command_timeout: 10m
          script: |
            echo "=== [1/5] Menghentikan proses tsx rogue (penyebab CPU 99%)..."
            pkill -f "tsx server.ts" 2>/dev/null && echo "  → tsx killed" || echo "  → tsx tidak ditemukan (ok)"
            pkill -f "npx.*tsx"      2>/dev/null && echo "  → npx tsx killed" || echo "  → npx tsx tidak ditemukan (ok)"
            sleep 2

            echo "=== [2/5] Masuk ke direktori deploy..."
            cd /var/www/nurhealth
            echo "  → PWD: $(pwd)"
            echo "  → dist/server.cjs: $(ls -lh dist/server.cjs 2>/dev/null || echo 'TIDAK ADA!')"

            echo "=== [3/5] Install runtime dependencies (ringan, tanpa build)..."
            npm install 2>&1 | tail -5
            echo "  → npm install selesai"

            echo "=== [4/5] Hapus proses PM2 lama & mulai yang baru..."
            pm2 delete nurhealth      2>/dev/null && echo "  → proses 'nurhealth' lama dihapus"      || true
            pm2 delete nurhealth-main 2>/dev/null && echo "  → proses 'nurhealth-main' lama dihapus" || true

            export NODE_ENV=production
            pm2 start ecosystem.config.cjs
            sleep 3

            echo "=== [5/5] Status akhir PM2..."
            pm2 list
            pm2 save 2>/dev/null || true

            echo ""
            echo "✅ === DEPLOYMENT SELESAI ==="
