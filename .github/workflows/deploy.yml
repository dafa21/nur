name: Deploy to VPS (nurhealthconnection.com)

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy App to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          command_timeout: 20m
          script: |
            set -e
            echo "=== [1/8] MEMULAI DEPLOYMENT ==="

            DEPLOY_PATH="/var/www/nurhealth"

            # ─── LANGKAH 1: KILL TSX ROGUE DULU ─────────────────────────────────────
            # Ini HARUS dilakukan SEBELUM build agar CPU bebas untuk npm install & build
            echo "=== [1/8] Membunuh proses tsx/npx yang memakan CPU 99%..."
            pkill -f "tsx server.ts" 2>/dev/null && echo "  → tsx server.ts killed" || echo "  → tidak ada proses tsx server.ts"
            pkill -f "npx.*tsx"      2>/dev/null && echo "  → npx tsx killed"        || echo "  → tidak ada proses npx tsx"
            # Beri waktu OS membebaskan CPU & port
            sleep 3
            echo "  → CPU sekarang bebas untuk build"

            # ─── LANGKAH 2: PASTIKAN FOLDER ADA ─────────────────────────────────────
            echo "=== [2/8] Memastikan direktori deploy ada..."
            if [ ! -d "$DEPLOY_PATH" ]; then
              mkdir -p "$DEPLOY_PATH" 2>/dev/null || \
              echo "${{ secrets.VPS_PASSWORD }}" | sudo -S mkdir -p "$DEPLOY_PATH"
              echo "${{ secrets.VPS_PASSWORD }}" | sudo -S chown -R $(whoami):$(whoami) "$DEPLOY_PATH" 2>/dev/null || true
            fi
            cd "$DEPLOY_PATH"
            echo "  → Direktori aktif: $(pwd)"

            # ─── LANGKAH 3: GIT PULL ─────────────────────────────────────────────────
            echo "=== [3/8] Mengambil kode terbaru dari GitHub..."
            if [ ! -d ".git" ]; then
              git init
              git remote add origin "https://github.com/${{ github.repository }}.git" || true
            fi
            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git fetch origin "${{ github.ref_name }}"
            git checkout -B "${{ github.ref_name }}" "origin/${{ github.ref_name }}"
            git reset --hard "origin/${{ github.ref_name }}"
            echo "  → Kode terbaru berhasil diambil (commit: $(git rev-parse --short HEAD))"

            # ─── LANGKAH 4: NPM INSTALL ──────────────────────────────────────────────
            echo "=== [4/8] Menginstal dependensi NPM..."
            npm install --prefer-offline 2>&1 | tail -5
            echo "  → npm install selesai"

            # ─── LANGKAH 5: BUILD ────────────────────────────────────────────────────
            echo "=== [5/8] Build produksi (Vite + esbuild)..."
            npm run build 2>&1
            # Verifikasi output build ada
            if [ ! -f "dist/server.cjs" ]; then
              echo "ERROR: dist/server.cjs tidak ditemukan setelah build!"
              ls -la dist/ || echo "Folder dist tidak ada"
              exit 1
            fi
            echo "  → Build sukses: dist/server.cjs ($(du -sh dist/server.cjs | cut -f1))"

            # ─── LANGKAH 6: PASTIKAN PM2 ADA ─────────────────────────────────────────
            echo "=== [6/8] Memastikan PM2 tersedia..."
            if ! command -v pm2 &>/dev/null; then
              echo "PM2 tidak ditemukan, menginstal..."
              npm install -g pm2 2>&1 | tail -3
            fi
            echo "  → PM2 versi: $(pm2 --version)"

            # ─── LANGKAH 7: RESTART PM2 ──────────────────────────────────────────────
            echo "=== [7/8] Memulai ulang aplikasi via PM2..."

            # Hapus semua proses lama (nama lama & baru) untuk fresh start
            pm2 delete nurhealth      2>/dev/null && echo "  → Proses 'nurhealth' lama dihapus"      || true
            pm2 delete nurhealth-main 2>/dev/null && echo "  → Proses 'nurhealth-main' lama dihapus" || true

            # Mulai dengan ecosystem.config.cjs (pakai node dist/server.cjs)
            export NODE_ENV=production
            pm2 start ecosystem.config.cjs
            echo "  → Proses baru dimulai"

            # Tunggu dan verifikasi
            sleep 4
            echo ""
            pm2 list
            echo ""
            STATUS=$(pm2 info nurhealth-main 2>/dev/null | grep "status" | head -1 || echo "unknown")
            echo "  → Status: $STATUS"

            # ─── LANGKAH 8: SAVE & SELESAI ───────────────────────────────────────────
            echo "=== [8/8] Menyimpan konfigurasi PM2..."
            pm2 save 2>/dev/null || \
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S pm2 save 2>/dev/null || true
            echo ""
            echo "✅ === DEPLOYMENT SELESAI DENGAN SUKSES ==="
